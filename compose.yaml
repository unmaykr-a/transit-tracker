# Local development: builds the image from this checkout.
#   docker compose up --build   →  http://localhost:8095
# Production deployment uses deploy/docker-compose.yml (image from GHCR).
services:
  bus:
    build:
      context: .
      args:
        VERSION: dev
    image: bus:dev
    container_name: bus
    ports:
      - "8095:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Tallinn
      BUS_LOG_LEVEL: debug
    volumes:
      - bus-data:/data

volumes:
  bus-data:
