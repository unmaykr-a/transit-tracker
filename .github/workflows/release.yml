name: Release

# Runs on a pushed v* tag, or manually: "Run workflow" with a version creates
# the tag on the chosen commit of main and releases it in the same run (a tag
# pushed by GITHUB_TOKEN would not start another workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write # create the tag and the release, attach the Home Assistant files
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version: $version"; exit 1; }
            tag="v$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Bus $version"
            git push origin "$tag"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bus
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  home-assistant:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha/card/package-lock.json
      - name: Build the card
        working-directory: ha/card
        env:
          BUS_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Package the integration
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' custom_components/bus/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/bus/manifest.json
          # The integration serves the card itself, so it is in the zip too.
          mkdir -p custom_components/bus/www
          cp ha/card/dist/bus-card.js custom_components/bus/www/
          (cd custom_components/bus && zip -r "$GITHUB_WORKSPACE/bus.zip" . -x '__pycache__/*')
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Bus ${{ needs.prepare.outputs.version }}
          body: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.prepare.outputs.tag }}/CHANGELOG.md).
          files: |
            bus.zip
            ha/card/dist/bus-card.js
