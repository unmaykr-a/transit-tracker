name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the Home Assistant integration and card to the release
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha/card/package-lock.json
      - name: Build the card
        working-directory: ha/card
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package the integration
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' ha/custom_components/bus/manifest.json > manifest.tmp
          mv manifest.tmp ha/custom_components/bus/manifest.json
          (cd ha/custom_components/bus && zip -r "$GITHUB_WORKSPACE/bus.zip" . -x '__pycache__/*')
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bus.zip
            ha/card/dist/bus-card.js
