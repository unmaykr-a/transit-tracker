name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/bus

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  ha:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ha/requirements_test.txt
      - run: pip install -r requirements_test.txt ruff==0.14.0
      - run: ruff check --config pyproject.toml . ../custom_components && ruff format --config pyproject.toml --check . ../custom_components
      - run: python -m pytest -q

  hacs:
    # The checks HACS runs when the repository is added as a custom repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands: only for the default HACS store; description/topics: GitHub repository settings.
          ignore: brands description topics
      - uses: home-assistant/actions/hassfest@master

  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha/card
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha/card/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web + binary
        run: make web build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright (fake feeds)
        working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: bus:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test ${{ matrix.platform }}
        run: |
          docker image inspect -f '{{.Architecture}} {{.Size}}' bus:ci
          docker run -d --name bus --platform ${{ matrix.platform }} -p 8095:8080 bus:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8095/healthz && break; sleep 1; done
          curl -fsS http://localhost:8095/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8095/map | grep -q '<div id="root">'
          docker exec bus /bus healthcheck
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' bus)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' bus | grep -qx healthy
      - if: failure()
        run: docker logs bus || true
